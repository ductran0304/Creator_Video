<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -110 160 110" width="160" height="110">
<g>
  <!-- back cover, opened wide (hard cover, teal-dark) -->
  <path d="M -76,-8 C -78,-40 -76,-72 -72,-102 C -40,-108 -8,-106 0,-98 C 8,-106 40,-108 72,-102 C 76,-72 78,-40 76,-8 C 40,-14 8,-12 0,-6 C -8,-12 -40,-14 -76,-8 Z"
        fill="#00857A" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>

  <!-- left page -->
  <path d="M -68,-14 C -70,-42 -68,-70 -65,-94 C -42,-99 -18,-98 -4,-92 C -2,-64 -2,-36 -3,-12 C -22,-18 -46,-19 -68,-14 Z"
        fill="#FFFFFF" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
  <!-- right page (this side kept relatively plain -> label_area) -->
  <path d="M 68,-14 C 70,-42 68,-70 65,-94 C 42,-99 18,-98 4,-92 C 2,-64 2,-36 3,-12 C 22,-18 46,-19 68,-14 Z"
        fill="#FFFFFF" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>

  <!-- spine -->
  <path d="M -4,-92 C -2,-64 -2,-36 -3,-12 L 3,-12 C 2,-36 2,-64 4,-92 Z" fill="#D8D8D8" stroke="#141414" stroke-width="3"/>

  <!-- left page ruled lines + numbers column -->
  <path d="M -60,-84 L -14,-86" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>
  <path d="M -60,-72 L -14,-73" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>
  <path d="M -60,-60 L -14,-61" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>
  <path d="M -60,-48 L -14,-49" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>
  <path d="M -60,-36 L -14,-37" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>
  <path d="M -60,-24 L -14,-25" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>
  <path d="M -22,-90 L -22,-16" stroke="#BDBDBD" stroke-width="3" stroke-linecap="round"/>

  <!-- little colored tally marks representing numbers in the column -->
  <g stroke="#00857A" stroke-width="4" stroke-linecap="round">
    <path d="M -19,-83 L -15,-83"/>
    <path d="M -19,-71 L -13,-71"/>
    <path d="M -19,-59 L -16,-59"/>
    <path d="M -19,-47 L -14,-47"/>
  </g>
  <path d="M -19,-35 L -13,-35" stroke="#FF5C7A" stroke-width="4" stroke-linecap="round"/>

  <!-- label_area on right page (0,-60,110) left mostly plain -->
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -150 260 300" width="260" height="300">
<g>
  <!-- sleeve / wrist, bottom-right -->
  <path d="M 30,150 C 10,110 -5,70 8,36 C 16,16 40,4 62,14 C 96,28 118,66 128,110 C 134,132 132,150 128,150 Z"
        fill="#00857A" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

  <!-- palm / back of hand -->
  <path d="M -8,40 C -20,20 -18,-4 -2,-16 C 10,-25 26,-24 36,-14 C 44,-6 48,6 46,20 C 58,20 68,30 66,42 C 64,54 52,60 42,58 C 44,68 36,78 24,78 C 26,86 18,94 8,92 C -2,100 -16,96 -20,84 C -30,76 -32,60 -24,48 C -20,42 -14,40 -8,40 Z"
        fill="#F2C6A0" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

  <!-- thumb -->
  <path d="M -18,40 C -34,32 -46,16 -44,0 C -43,-10 -34,-16 -25,-12 C -14,-6 -8,10 -10,26 C -11,33 -13,38 -18,40 Z"
        fill="#F2C6A0" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

  <!-- pen barrel: from fingers (near -30,0) up to tip at (-115,-140) -->
  <path d="M -30,4 L -115,-140" stroke="#141414" stroke-width="20" stroke-linecap="round"/>
  <path d="M -30,4 L -115,-140" stroke="#F58220" stroke-width="12" stroke-linecap="round"/>

  <!-- pen tip (marker nib touching the surface) -->
  <path d="M -115,-140 L -104,-118 L -122,-120 Z" fill="#141414"/>

  <!-- fingers gripping the pen, drawn over the barrel -->
  <path d="M -18,-4 C -24,-14 -22,-26 -12,-30 C -2,-34 8,-28 10,-18 C 12,-10 8,-2 0,2 C -6,6 -14,4 -18,-4 Z"
        fill="#F2C6A0" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 2,10 C -4,0 -2,-12 8,-16 C 18,-20 28,-14 30,-4 C 32,4 28,12 20,16 C 14,20 6,18 2,10 Z"
        fill="#F2C6A0" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 18,24 C 12,14 14,2 24,-2 C 34,-6 44,0 46,10 C 48,18 44,26 36,30 C 30,34 22,32 18,24 Z"
        fill="#F2C6A0" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

  <!-- knuckle crease details -->
  <g stroke="#141414" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M -6,-2 C -2,4 2,6 6,4"/>
    <path d="M 10,14 C 14,20 18,22 22,20"/>
    <path d="M 26,28 C 30,34 34,36 38,34"/>
  </g>
</g>
</svg>

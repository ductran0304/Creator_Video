<svg xmlns="http://www.w3.org/2000/svg" viewBox="-55 -170 110 170" width="110" height="170">
<g>
  <!-- telescopic pull handle, raised high -->
  <line x1="-15" y1="-138" x2="-15" y2="-168" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
  <line x1="15" y1="-138" x2="15" y2="-168" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
  <line x1="-15" y1="-138" x2="-15" y2="-168" stroke="#8A8A8A" stroke-width="4" stroke-linecap="round"/>
  <line x1="15" y1="-138" x2="15" y2="-168" stroke="#8A8A8A" stroke-width="4" stroke-linecap="round"/>
  <path d="M -19,-168 C -19,-178 19,-178 19,-168 L 19,-160 C 19,-166 -19,-166 -19,-160 Z"
        fill="#BDBDBD" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

  <!-- luggage tag -->
  <path d="M 30,-134 L 44,-118" stroke="#141414" stroke-width="3" fill="none"/>
  <rect x="36" y="-118" width="20" height="14" rx="3" fill="#F4C430" stroke="#141414" stroke-width="4" transform="rotate(18 46 -111)"/>

  <!-- suitcase body -->
  <path d="M -35,-138 C -37,-100 -37,-56 -35,-14 C -12,-9 12,-9 35,-14 C 37,-56 37,-100 35,-138 C 12,-143 -12,-143 -35,-138 Z"
        fill="#F28C28" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>

  <!-- ribs / texture -->
  <g stroke="#C96E12" stroke-width="4" fill="none">
    <path d="M -22,-134 C -24,-98 -24,-56 -22,-18"/>
    <path d="M 0,-136 C -1,-98 -1,-56 0,-16"/>
    <path d="M 22,-134 C 24,-98 24,-56 22,-18"/>
  </g>

  <!-- front strap with buckle -->
  <rect x="-37" y="-84" width="76" height="14" rx="3" fill="#7A4F2A" stroke="#141414" stroke-width="5"/>
  <rect x="-9" y="-88" width="18" height="22" rx="3" fill="#BDBDBD" stroke="#141414" stroke-width="5"/>

  <!-- small top grab handle on the case -->
  <path d="M -14,-138 C -14,-148 14,-148 14,-138" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>

  <!-- wheels -->
  <circle cx="-19" cy="-9" r="10" fill="#5A5A5E" stroke="#141414" stroke-width="6"/>
  <circle cx="19" cy="-9" r="10" fill="#5A5A5E" stroke="#141414" stroke-width="6"/>
  <circle cx="-19" cy="-9" r="3" fill="#8A8A8A"/>
  <circle cx="19" cy="-9" r="3" fill="#8A8A8A"/>
</g>
</svg>

  <path d="M -10,799 C 120,791 200,807 330,798 C 450,790 550,805 670,798 C 790,790 880,806 1000,799 C 1120,791 1210,806 1330,798 C 1450,790 1550,805 1670,798 C 1790,790 1870,805 1930,798 L 1930,1090 L -10,1090 Z"

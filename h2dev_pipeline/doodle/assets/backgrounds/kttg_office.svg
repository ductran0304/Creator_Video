    <line x1="1584" y1="380" x2="1854" y2="378" stroke="#141414" stroke-width="6"/>
    <line x1="1584" y1="500" x2="1854" y2="500" stroke="#141414" stroke-width="6"/>
    <line x1="1584" y1="620" x2="1854" y2="620" stroke="#141414" stroke-width="6"/>

    <!-- top shelf: standing binders -->
    <rect x="1596" y="298" width="34" height="78" rx="3" fill="#00C2A8" stroke="#141414" stroke-width="5"/>
    <rect x="1634" y="290" width="34" height="86" rx="3" fill="#101A3D" stroke="#141414" stroke-width="5"/>
    <rect x="1672" y="302" width="34" height="74" rx="3" fill="#FFC93C" stroke="#141414" stroke-width="5"/>
    <rect x="1710" y="294" width="34" height="82" rx="3" fill="#00857A" stroke="#141414" stroke-width="5"/>
    <rect x="1748" y="300" width="34" height="76" rx="3" fill="#FF5C7A" stroke="#141414" stroke-width="5"/>
    <rect x="1786" y="292" width="34" height="84" rx="3" fill="#101A3D" stroke="#141414" stroke-width="5"/>

    <!-- 2nd shelf: standing binders -->
    <rect x="1596" y="418" width="34" height="78" rx="3" fill="#101A3D" stroke="#141414" stroke-width="5"/>
    <rect x="1634" y="424" width="34" height="72" rx="3" fill="#FF5C7A" stroke="#141414" stroke-width="5"/>
    <rect x="1672" y="416" width="34" height="80" rx="3" fill="#00C2A8" stroke="#141414" stroke-width="5"/>
    <rect x="1710" y="422" width="34" height="74" rx="3" fill="#FFC93C" stroke="#141414" stroke-width="5"/>
    <rect x="1748" y="414" width="34" height="82" rx="3" fill="#00857A" stroke="#141414" stroke-width="5"/>
    <rect x="1786" y="420" width="34" height="76" rx="3" fill="#101A3D" stroke="#141414" stroke-width="5"/>

    <!-- 3rd shelf: flat stacked folders -->
    <rect x="1596" y="562" width="80" height="20" rx="3" fill="#FFC93C" stroke="#141414" stroke-width="5"/>
    <rect x="1596" y="582" width="80" height="20" rx="3" fill="#00C2A8" stroke="#141414" stroke-width="5"/>
    <rect x="1690" y="562" width="80" height="20" rx="3" fill="#FF5C7A" stroke="#141414" stroke-width="5"/>
    <rect x="1690" y="582" width="80" height="20" rx="3" fill="#00857A" stroke="#141414" stroke-width="5"/>
    <rect x="1784" y="562" width="60" height="20" rx="3" fill="#101A3D" stroke="#141414" stroke-width="5"/>
    <rect x="1784" y="582" width="60" height="20" rx="3" fill="#FFC93C" stroke="#141414" stroke-width="5"/>

    <!-- 4th shelf: boxes -->
    <rect x="1600" y="640" width="70" height="70" rx="4" fill="#00C2A8" stroke="#141414" stroke-width="6"/>
    <rect x="1682" y="640" width="70" height="70" rx="4" fill="#101A3D" stroke="#141414" stroke-width="6"/>
    <rect x="1764" y="640" width="70" height="70" rx="4" fill="#FFC93C" stroke="#141414" stroke-width="6"/>
  </g>
</svg>

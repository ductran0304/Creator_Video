    <path d="M 56,706 C 64,680 82,668 102,662 C 82,694 72,706 56,706 Z" fill="#00857A" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 12,760 L 100,760 L 92,822 L 20,822 Z" fill="#D2B488" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- ============ RIGHT: filing cabinet + plant ============ -->
  <g>
    <path d="M 1650,762 C 1648,600 1648,440 1652,268 C 1712,262 1780,262 1836,268 C 1840,440 1840,600 1838,760 C 1780,754 1712,754 1650,762 Z"

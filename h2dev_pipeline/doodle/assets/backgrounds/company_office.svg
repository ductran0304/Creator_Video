    <rect x="1666" y="298" width="158" height="120" rx="6" fill="#101A3D" stroke="#141414" stroke-width="6"/>
    <rect x="1728" y="348" width="34" height="14" rx="4" fill="#FFC93C" stroke="#141414" stroke-width="4"/>
    <rect x="1666" y="440" width="158" height="120" rx="6" fill="#101A3D" stroke="#141414" stroke-width="6"/>
    <rect x="1728" y="490" width="34" height="14" rx="4" fill="#FF5C7A" stroke="#141414" stroke-width="4"/>
    <rect x="1666" y="582" width="158" height="120" rx="6" fill="#101A3D" stroke="#141414" stroke-width="6"/>
    <rect x="1728" y="632" width="34" height="14" rx="4" fill="#00C2A8" stroke="#141414" stroke-width="4"/>
  </g>

  <g>
    <path d="M 1856,760 C 1856,724 1878,696 1896,696 C 1914,696 1936,724 1936,760 L 1856,760 Z" fill="#00857A" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 1848,760 L 1944,760 L 1936,824 L 1856,824 Z" fill="#D2B488" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

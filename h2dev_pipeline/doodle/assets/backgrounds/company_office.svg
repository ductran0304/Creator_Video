    <!-- monitor -->
    <rect x="150" y="562" width="14" height="30" fill="#5A5A5E" stroke="#141414" stroke-width="5"/>
    <path d="M 118,660 C 118,672 200,672 200,660 L 200,666 C 200,674 118,674 118,666 Z" fill="#5A5A5E" stroke="#141414" stroke-width="5"/>
    <rect x="98" y="576" width="164" height="108" rx="10" fill="#101A3D" stroke="#141414" stroke-width="7"/>
    <rect x="114" y="590" width="132" height="80" rx="4" fill="#F4F7FF"/>

    <!-- keyboard -->
    <rect x="110" y="700" width="120" height="26" rx="6" fill="#00C2A8" stroke="#141414" stroke-width="5"/>
  </g>

  <!-- potted plant, left edge -->
  <g>
    <path d="M 20,760 C 20,730 40,706 56,706 C 72,706 92,730 92,760 L 20,760 Z" fill="#00857A" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>

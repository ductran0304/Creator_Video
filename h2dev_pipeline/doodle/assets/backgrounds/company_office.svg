          fill="#FFFFFF" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
    <!-- simple bar chart, no text -->
    <rect x="90" y="380" width="26" height="46" fill="#00C2A8" stroke="#141414" stroke-width="4"/>
    <rect x="130" y="350" width="26" height="76" fill="#FF5C7A" stroke="#141414" stroke-width="4"/>
    <rect x="170" y="360" width="26" height="66" fill="#FFC93C" stroke="#141414" stroke-width="4"/>

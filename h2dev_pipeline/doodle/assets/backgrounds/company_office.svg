    <rect x="250" y="366" width="26" height="60" fill="#00857A" stroke="#141414" stroke-width="4"/>
    <polyline points="98,360 143,320 183,332 223,300 263,336" fill="none" stroke="#141414" stroke-width="4"/>

    <!-- desk -->
    <rect x="52" y="758" width="16" height="72" fill="#D2B488" stroke="#141414" stroke-width="6"/>
    <rect x="300" y="758" width="16" height="72" fill="#D2B488" stroke="#141414" stroke-width="6"/>
    <path d="M 36,736 C 130,730 240,730 332,736 C 334,748 334,756 332,762 C 240,768 130,768 36,762 C 34,756 34,748 36,736 Z"
